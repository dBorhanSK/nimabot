services:
  - type: web
    name: v2ray-sales-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "6914909647"
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SUPPORT_USERNAME
        sync: false
      - key: CARD_NUMBER
        sync: false
